<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- 本地资源带时间戳，避免浏览器缓存旧版，改完文件普通刷新即可生效 -->
  <script>document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">')</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
</head>
<body>
  <!-- 所有可编辑文案都在 config.js → labels / 站点信息，本文件只负责结构 -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"></a>
      <nav class="nav">
        <a href="index.html" data-label="navHome"></a>
        <a href="index.html#posts" data-label="navPosts"></a>
        <a href="index.html#about" data-label="navAbout"></a>
      </nav>
      <button id="themeToggle" class="theme-toggle"></button>
    </div>
  </header>

  <main class="container article-page">
    <article class="article">
      <header class="article-head">
        <span id="articleTag" class="tag" data-label="loading"></span>
        <h1 id="articleTitle" data-label="loading"></h1>
        <div id="articleMeta" class="meta"></div>
      </header>

      <div id="articleBody" class="article-body"></div>

      <footer class="article-foot">
        <a class="btn primary" href="index.html" data-label="backHome"></a>
      </footer>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footerText"></p>
    </div>
  </footer>

  <script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>')</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script>document.write('<script src="js/main.js?v=' + Date.now() + '"><\/script>')</script>
</body>
</html>
